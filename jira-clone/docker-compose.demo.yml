# Internal demo stack — exposes ONLY the app on port 8001.
# Postgres and Redis are not published to the host network.
#
# Usage:
#   cp .env.demo.example .env   # edit PUBLIC_BASE_URL and secrets
#   docker compose -f docker-compose.demo.yml up -d --build

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: projectboard
      POSTGRES_USER: board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-board}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d projectboard"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8001:8001"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/projectboard
      DB_USER: board
      DB_PASSWORD: ${POSTGRES_PASSWORD:-board}
      REDIS_URL: redis://redis:6379
      PORT: "8001"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-demo-admin-key}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
