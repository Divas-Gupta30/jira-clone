services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: projectboard
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U board -d projectboard"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8001:8001"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/projectboard
      DB_USER: board
      DB_PASSWORD: board
      REDIS_URL: redis://redis:6379
      PORT: "8001"
      FLYWAY_REPAIR: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-demo-admin-key}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
